name: C2 final quiescence correction

on:
  push:
    branches:
      - fix/c2-02-final-quiescence

permissions:
  contents: write

jobs:
  correct-and-certify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply narrow C2-02 correction
        shell: pwsh
        run: |
          python .github/c2_quiescence_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/c2_quiescence_format_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focused lifecycle regressions
        shell: pwsh
        run: |
          python -m pytest tests/runtime/test_windows_transactional_capture_authority.py -q -k "lifecycle_lease_release_waits_for_in_flight_held_operation or lifecycle_lease_close_wins_against_blocked_arbiter_entry or lifecycle_lease_post_enter_setup_failure_releases_once or lifecycle_lease_release_failure_is_terminal_and_exactly_once or lifecycle_lease_success_enters_and_releases_once"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Static checks
        shell: pwsh
        run: |
          python -m ruff check src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify production SQL identity
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib
          path = Path("src/trading_bot/runtime/schema/windows_transactional_authority_v1.sql")
          data = path.read_bytes()
          assert len(data) == 118896, len(data)
          assert hashlib.sha256(data).hexdigest() == "aa61df2f5db0090f8373222d1f5e492a58f4c10273afacfab45e382bacd4bb58"
          print(len(data), hashlib.sha256(data).hexdigest())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Combined C2 certification
        shell: pwsh
        run: |
          python -m pytest tests/runtime/test_windows_transactional_authority_service.py tests/runtime/test_windows_transactional_capture_authority.py -q --durations=100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified correction
        shell: pwsh
        run: |
          git status --short
          git rm .github/workflows/c2-final-quiescence.yml .github/c2_quiescence_patch.py .github/c2_quiescence_format_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "ChatGPT C2 Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add src/trading_bot/runtime/windows_transactional_authority.py tests/runtime/test_windows_transactional_capture_authority.py docs/architecture/81-windows-production-transactional-authority-service.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix: complete transactional lifecycle quiescence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:fix/c2-02-final-quiescence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
