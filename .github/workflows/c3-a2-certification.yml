name: C3 A2 certification

on:
  push:
    branches:
      - feature/c3-a2-certification
    paths:
      - src/trading_bot/runtime/windows_effectful_capture_protocol.py
      - tests/runtime/test_windows_effectful_capture_protocol.py
      - .github/workflows/c3-a2-certification.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Apply final reviewed corrections
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/trading_bot/runtime/windows_effectful_capture_protocol.py")
          text = source.read_text(encoding="utf-8")
          old = '            "authorized_snapshot_session": request.authorized_snapshot_session.session_date.isoformat(),\n'
          new = (
              '            "authorized_snapshot_session": (\n'
              '                request.authorized_snapshot_session.session_date.isoformat()\n'
              '            ),\n'
          )
          if text.count(old) not in (0, 1):
              raise SystemExit(f"unexpected session-format anchor count: {text.count(old)}")
          if old in text:
              text = text.replace(old, new)
          old = '    """Opaque process-local proof that parent-side final artifact verification passed."""\n'
          new = (
              '    """Opaque process-local proof of successful parent artifact verification."""\n'
          )
          if text.count(old) not in (0, 1):
              raise SystemExit(f"unexpected verifier-doc anchor count: {text.count(old)}")
          if old in text:
              text = text.replace(old, new)
          source.write_text(text, encoding="utf-8")

          tests = Path("tests/runtime/test_windows_effectful_capture_protocol.py")
          text = tests.read_text(encoding="utf-8")
          old = 'with pytest.raises(WindowsEffectfulCaptureProtocolError, match="response evidence"):'
          new = 'with pytest.raises(WindowsEffectfulCaptureProtocolError, match="(?:transport|response) evidence"):'
          if text.count(old) not in (0, 1):
              raise SystemExit(f"unexpected expectation anchor count: {text.count(old)}")
          if old in text:
              tests.write_text(text.replace(old, new), encoding="utf-8")

      - name: Ruff format
        run: python -m ruff format src/trading_bot/runtime/windows_effectful_capture_protocol.py tests/runtime/test_windows_effectful_capture_protocol.py

      - name: Ruff check
        run: python -m ruff check src/trading_bot/runtime/windows_effectful_capture_protocol.py tests/runtime/test_windows_effectful_capture_protocol.py

      - name: Ruff format check
        run: python -m ruff format --check src/trading_bot/runtime/windows_effectful_capture_protocol.py tests/runtime/test_windows_effectful_capture_protocol.py

      - name: Focused tests
        run: python -m pytest tests/runtime/test_windows_effectful_capture_contracts.py tests/runtime/test_windows_effectful_capture_protocol.py tests/market_data/test_daily_snapshot_models.py tests/market_data/test_daily_snapshot_provider.py tests/market_data/test_daily_snapshot_identity.py tests/market_data/test_daily_snapshot_serialization.py tests/market_data/test_daily_snapshot_verification.py tests/market_data/test_daily_snapshot_acceptance.py -q

      - name: Diff check
        run: git diff --check

      - name: SQL identity
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          path = Path("src/trading_bot/runtime/schema/windows_transactional_authority_v1.sql")
          payload = path.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert len(payload) == 118896, len(payload)
          assert digest == "aa61df2f5db0090f8373222d1f5e492a58f4c10273afacfab45e382bacd4bb58"
          print(len(payload), digest)

      - name: Publish certified exact files
        run: |
          printf '%s\n' 'C3-A2 certification passed' > .c3-a2-certification-success
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/trading_bot/runtime/windows_effectful_capture_protocol.py \
            tests/runtime/test_windows_effectful_capture_protocol.py \
            .c3-a2-certification-success
          git commit -m "test: record final C3 A2 certification"
          git push origin HEAD:feature/c3-a2-certification
