name: C3 A2 certification

on:
  push:
    branches:
      - feature/c3-a2-certification

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Apply reviewed pre-certification corrections
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/trading_bot/runtime/windows_effectful_capture_protocol.py")
          text = source.read_text(encoding="utf-8")
          text = text.replace(
              "    MAX_DAILY_SNAPSHOT_ARTIFACT_BYTES,\n    ProviderDescriptor,\n",
              "    MAX_DAILY_SNAPSHOT_ARTIFACT_BYTES,\n    MAX_DAILY_SNAPSHOT_SYMBOLS,\n    ProviderDescriptor,\n",
          )
          text = text.replace(
              "        if not universe or any(type(symbol) is not Symbol for symbol in universe):\n",
              "        if not 1 <= len(universe) <= MAX_DAILY_SNAPSHOT_SYMBOLS or any(\n"
              "            type(symbol) is not Symbol for symbol in universe\n"
              "        ):\n",
          )
          source.write_text(text, encoding="utf-8")

          tests = Path("tests/runtime/test_windows_effectful_capture_protocol.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              "        replace(request, execution_id=_EXECUTION.upper())\n",
              "        replace(\n"
              "            request,\n"
              "            execution_id=\"AAAAAAAA-AAAA-4AAA-8AAA-AAAAAAAAAAAA\",\n"
              "        )\n",
          )
          tests.write_text(text, encoding="utf-8")

      - name: Ruff autofix imports
        run: >-
          python -m ruff check --fix
          src/trading_bot/runtime/windows_effectful_capture_protocol.py
          tests/runtime/test_windows_effectful_capture_protocol.py

      - name: Format A2 files
        run: >-
          python -m ruff format
          src/trading_bot/runtime/windows_effectful_capture_protocol.py
          tests/runtime/test_windows_effectful_capture_protocol.py

      - name: Ruff check
        run: >-
          python -m ruff check
          src/trading_bot/runtime/windows_effectful_capture_protocol.py
          tests/runtime/test_windows_effectful_capture_protocol.py

      - name: C3 A1 and A2 focused tests
        run: >-
          python -m pytest
          tests/runtime/test_windows_effectful_capture_contracts.py
          tests/runtime/test_windows_effectful_capture_protocol.py
          tests/market_data/test_daily_snapshot_models.py
          tests/market_data/test_daily_snapshot_provider.py
          tests/market_data/test_daily_snapshot_identity.py
          tests/market_data/test_daily_snapshot_serialization.py
          tests/market_data/test_daily_snapshot_verification.py
          tests/market_data/test_daily_snapshot_acceptance.py
          -q

      - name: Diff check
        run: git diff --check

      - name: SQL identity
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          path = Path("src/trading_bot/runtime/schema/windows_transactional_authority_v1.sql")
          payload = path.read_bytes()
          assert len(payload) == 118896, len(payload)
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "aa61df2f5db0090f8373222d1f5e492a58f4c10273afacfab45e382bacd4bb58"
          print(len(payload), digest)

      - name: Publish certified temporary tree
        run: |
          printf '%s\n' 'C3-A2 certification passed' > .c3-a2-certification-success
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/trading_bot/runtime/windows_effectful_capture_protocol.py \
            tests/runtime/test_windows_effectful_capture_protocol.py \
            .c3-a2-certification-success
          git commit -m "test: record C3 A2 certification"
          git push origin HEAD:feature/c3-a2-certification
