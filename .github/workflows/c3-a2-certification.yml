name: C3 A2 certification

on:
  push:
    branches:
      - feature/c3-a2-certification

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - id: ruff_check
        name: Ruff check
        continue-on-error: true
        run: python -m ruff check src/trading_bot/runtime/windows_effectful_capture_protocol.py tests/runtime/test_windows_effectful_capture_protocol.py > .c3-a2-ruff-check.txt 2>&1

      - id: ruff_format
        name: Ruff format check
        continue-on-error: true
        run: python -m ruff format --check src/trading_bot/runtime/windows_effectful_capture_protocol.py tests/runtime/test_windows_effectful_capture_protocol.py > .c3-a2-ruff-format.txt 2>&1

      - id: focused_tests
        name: Focused tests
        continue-on-error: true
        run: python -m pytest tests/runtime/test_windows_effectful_capture_contracts.py tests/runtime/test_windows_effectful_capture_protocol.py tests/market_data/test_daily_snapshot_models.py tests/market_data/test_daily_snapshot_provider.py tests/market_data/test_daily_snapshot_identity.py tests/market_data/test_daily_snapshot_serialization.py tests/market_data/test_daily_snapshot_verification.py tests/market_data/test_daily_snapshot_acceptance.py -q > .c3-a2-tests.txt 2>&1

      - id: diff_check
        name: Diff check
        continue-on-error: true
        run: git diff --check 0975f1aa28a391d5462d5c1362472bac89a89ece HEAD -- src/trading_bot/runtime/windows_effectful_capture_protocol.py tests/runtime/test_windows_effectful_capture_protocol.py

      - id: sql_identity
        name: SQL identity
        continue-on-error: true
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          path = Path("src/trading_bot/runtime/schema/windows_transactional_authority_v1.sql")
          payload = path.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert len(payload) == 118896, len(payload)
          assert digest == "aa61df2f5db0090f8373222d1f5e492a58f4c10273afacfab45e382bacd4bb58"
          print(len(payload), digest)

      - name: Record outcomes and logs
        if: always()
        env:
          RUFF_CHECK: ${{ steps.ruff_check.outcome }}
          RUFF_FORMAT: ${{ steps.ruff_format.outcome }}
          FOCUSED_TESTS: ${{ steps.focused_tests.outcome }}
          DIFF_CHECK: ${{ steps.diff_check.outcome }}
          SQL_IDENTITY: ${{ steps.sql_identity.outcome }}
        run: |
          printf 'ruff_check=%s\nruff_format=%s\nfocused_tests=%s\ndiff_check=%s\nsql_identity=%s\n' \
            "$RUFF_CHECK" "$RUFF_FORMAT" "$FOCUSED_TESTS" "$DIFF_CHECK" "$SQL_IDENTITY" \
            > .c3-a2-certification-report
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .c3-a2-certification-report .c3-a2-ruff-check.txt .c3-a2-ruff-format.txt .c3-a2-tests.txt
          git commit -m "test: record C3 A2 certification diagnostics"
          git push origin HEAD:feature/c3-a2-certification
