name: C3 A2 certification

on:
  push:
    branches:
      - feature/c3-a2-certification

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check src/trading_bot/runtime/windows_effectful_capture_protocol.py tests/runtime/test_windows_effectful_capture_protocol.py

      - name: Ruff format check
        run: python -m ruff format --check src/trading_bot/runtime/windows_effectful_capture_protocol.py tests/runtime/test_windows_effectful_capture_protocol.py

      - name: Focused tests
        run: python -m pytest tests/runtime/test_windows_effectful_capture_contracts.py tests/runtime/test_windows_effectful_capture_protocol.py tests/market_data/test_daily_snapshot_models.py tests/market_data/test_daily_snapshot_provider.py tests/market_data/test_daily_snapshot_identity.py tests/market_data/test_daily_snapshot_serialization.py tests/market_data/test_daily_snapshot_verification.py tests/market_data/test_daily_snapshot_acceptance.py -q

      - name: Diff check
        run: git diff --check 0975f1aa28a391d5462d5c1362472bac89a89ece HEAD -- src/trading_bot/runtime/windows_effectful_capture_protocol.py tests/runtime/test_windows_effectful_capture_protocol.py

      - name: SQL identity
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          path = Path("src/trading_bot/runtime/schema/windows_transactional_authority_v1.sql")
          payload = path.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert len(payload) == 118896, len(payload)
          assert digest == "aa61df2f5db0090f8373222d1f5e492a58f4c10273afacfab45e382bacd4bb58"
          print(len(payload), digest)

      - name: Record outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '%s\n' "$JOB_STATUS" > .c3-a2-certification-status
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .c3-a2-certification-status
          git commit -m "test: record C3 A2 certification status"
          git push origin HEAD:feature/c3-a2-certification
