name: C3 A3 certification

on:
  push:
    branches:
      - feature/c3-a3-certification

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Format A3 files
        run: >-
          python -m ruff format
          src/trading_bot/runtime/windows_effectful_capture_service.py
          tests/runtime/test_windows_effectful_capture_service.py
      - name: Ruff check
        run: >-
          python -m ruff check
          src/trading_bot/runtime/windows_effectful_capture.py
          src/trading_bot/runtime/windows_effectful_capture_protocol.py
          src/trading_bot/runtime/windows_effectful_capture_service.py
          tests/runtime/test_windows_effectful_capture_contracts.py
          tests/runtime/test_windows_effectful_capture_protocol.py
          tests/runtime/test_windows_effectful_capture_service.py
      - name: Focused tests
        run: >-
          python -m pytest
          tests/runtime/test_windows_effectful_capture_contracts.py
          tests/runtime/test_windows_effectful_capture_protocol.py
          tests/runtime/test_windows_effectful_capture_service.py
          tests/runtime/test_windows_authority_capability.py
          tests/market_data/test_daily_snapshot_provider.py
          tests/market_data/test_daily_snapshot_identity.py
          tests/market_data/test_daily_snapshot_serialization.py
          tests/market_data/test_daily_snapshot_verification.py
          tests/market_data/test_daily_snapshot_acceptance.py
          -q
      - name: Ruff format check
        run: >-
          python -m ruff format --check
          src/trading_bot/runtime/windows_effectful_capture.py
          src/trading_bot/runtime/windows_effectful_capture_protocol.py
          src/trading_bot/runtime/windows_effectful_capture_service.py
          tests/runtime/test_windows_effectful_capture_contracts.py
          tests/runtime/test_windows_effectful_capture_protocol.py
          tests/runtime/test_windows_effectful_capture_service.py
      - name: Diff check
        run: git diff --check
      - name: SQL identity
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          path = Path("src/trading_bot/runtime/schema/windows_transactional_authority_v1.sql")
          payload = path.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert len(payload) == 118896, len(payload)
          assert digest == "aa61df2f5db0090f8373222d1f5e492a58f4c10273afacfab45e382bacd4bb58"
      - name: Publish certified tree
        run: |
          printf '%s\n' 'C3-A3 certification passed' > .c3-a3-certification-success
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/trading_bot/runtime/windows_effectful_capture_service.py \
            tests/runtime/test_windows_effectful_capture_service.py \
            .c3-a3-certification-success
          git commit -m "test: record C3 A3 certification"
          git push origin HEAD:feature/c3-a3-certification
