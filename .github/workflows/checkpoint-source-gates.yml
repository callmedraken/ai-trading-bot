name: Checkpoint Source Gates

on:
  push:
    branches:
      - develop
      - feature/d10c-durable-wake-evidence
  pull_request:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install source-gate dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check `
            "pytest>=8.0,<9.0" `
            "ruff>=0.6,<1.0" `
            "tzdata>=2024.1,<2027.0"

      - name: Show checkpoint status
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops.ps1 status

      - name: Verify source checkpoints
        shell: powershell
        run: |
          $env:AI_TRADING_BOT_CHECKPOINT_EVIDENCE_ROOT = Join-Path `
            $env:RUNNER_TEMP 'ai-trading-bot-checkpoints'
          $Failures = @()

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops.ps1 `
            verify arch128-parent-acl-repair
          if ($LASTEXITCODE -ne 0) {
            $Failures += 'arch128-parent-acl-repair'
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops.ps1 `
            verify arch128-r4
          if ($LASTEXITCODE -ne 0) {
            $Failures += 'arch128-r4'
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops.ps1 `
            verify arch128-r5-substrate
          if ($LASTEXITCODE -ne 0) {
            $Failures += 'arch128-r5-substrate'
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops.ps1 `
            verify arch128-r5-trading
          if ($LASTEXITCODE -ne 0) {
            $Failures += 'arch128-r5-trading'
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops.ps1 `
            verify arch128-r6
          if ($LASTEXITCODE -ne 0) {
            $Failures += 'arch128-r6'
          }

          if ($Failures.Count -ne 0) {
            throw "Checkpoint source gates failed: $($Failures -join ', ')"
          }

      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-source-gate-evidence
          path: ${{ runner.temp }}/ai-trading-bot-checkpoints
          if-no-files-found: ignore
