name: Checkpoint Source Gates

on:
  push:
    branches:
      - develop
      - feature/d10c-durable-wake-evidence
  pull_request:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install source-gate dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check `
            "pytest>=8.0,<9.0" `
            "ruff>=0.6,<1.0" `
            "tzdata>=2024.1,<2027.0"

      - name: Show checkpoint status
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops.ps1 status

      - name: Verify Architecture 128 parent ACL repair
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops.ps1 `
            verify arch128-parent-acl-repair

      - name: Verify Architecture 128 R4 replacement
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops.ps1 `
            verify arch128-r4
