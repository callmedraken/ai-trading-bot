name: Codex review on push

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  request-codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Find the open pull request for this branch
        id: pull-request
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          pull_request_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --limit 1 | jq -r '.[0].number // empty')"

          if [[ -z "$pull_request_number" ]]; then
            echo "has_pull_request=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_pull_request=true" >> "$GITHUB_OUTPUT"
          echo "number=$pull_request_number" >> "$GITHUB_OUTPUT"

      - name: Request Codex review for the new head
        if: steps.pull-request.outputs.has_pull_request == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PULL_REQUEST_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "@codex review"
